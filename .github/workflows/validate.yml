name: Validate SkyDream site

on:
  push:
    branches: [main, security-seo-hardening, security-hardening-2026-10-06]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/secure-index.js
          node --check functions/no-sms-index.js
          node --check functions/no-secret-loader.js
          node --check functions/guarded-loader.js
          node --check functions/security-hardening-loader.js
          node --check assets/firebase.js
          node --check assets/public.js
          node --check assets/admin.js
          node --check assets/admin-intake.js
          node --check assets/facilitator.js
          node --check assets/schedule-live.js
          node --check pwa.js
          node --check service-worker.js
      - name: Verify production security entrypoint
        run: |
          node - <<'NODE'
          const pkg = require('./functions/package.json');
          if (pkg.main !== 'security-hardening-loader.js') {
            throw new Error('Production functions must use security-hardening-loader.js');
          }
          const fs = require('fs');
          const hardening = fs.readFileSync('functions/security-hardening-loader.js', 'utf8');
          if (!hardening.includes('checkStudentStatus is intentionally not wrapped or changed')) {
            throw new Error('Student status compatibility guard is missing');
          }
          if (!hardening.includes('Administrator PIN sign-in has been disabled')) {
            throw new Error('Legacy administrator PIN sign-in is not explicitly disabled');
          }
          NODE
      - name: Check HTML for duplicate IDs
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if d.get('id'):
                      self.ids.append(d['id'])

          failed = False
          for path in Path('.').glob('*.html'):
              parser = IdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
              if duplicates:
                  failed = True
                  print(f'{path}: duplicate IDs: {duplicates}')
          raise SystemExit(1 if failed else 0)
          PY
