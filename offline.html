<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F3A93">
<title>SkyDream — Offline</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#EAF2FD;color:#333;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(520px,100%);background:#fff;border:1px solid #E1E8F5;border-radius:20px;padding:32px;text-align:center;box-shadow:0 12px 35px rgba(31,58,147,.12)}img{width:92px;height:92px;margin:0 auto 18px}h1{color:#1F3A93;margin:0 0 10px;font-size:1.7rem}p{color:#5B6472;line-height:1.6;margin:0 0 22px}.btn{display:inline-block;border:0;border-radius:999px;padding:12px 22px;background:#2F80ED;color:#fff;font-weight:700;cursor:pointer}.small{margin-top:18px;font-size:.82rem;color:#8891A0}
</style>
</head>
<body>
<main class="card">
<img src="./skydream-app-icon-v3.png" alt="SkyDream">
<h1>You’re offline</h1>
<p>SkyDream is installed and can still open, but live features such as registration, status checks and admin updates need an internet connection.</p>
<button class="btn" onclick="location.reload()">Try Again</button>
<div class="small">SkyDream Skills Training Academy</div>
</main>
</body>
</html>
