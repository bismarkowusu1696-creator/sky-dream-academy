name: Validate SkyDream site

on:
  push:
    branches: [main, security-seo-hardening, security-hardening-2026-10-06]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find functions assets -type f -name '*.js' -print0)
          node --check pwa.js
          node --check service-worker.js
      - name: Verify production security entrypoint
        run: |
          node - <<'NODE'
          const pkg = require('./functions/package.json');
          if (pkg.main !== 'security-hardening-loader.js') {
            throw new Error('Production functions must use security-hardening-loader.js');
          }
          const fs = require('fs');
          const hardening = fs.readFileSync('functions/security-hardening-loader.js', 'utf8');
          if (!hardening.includes('checkStudentStatus is intentionally not wrapped or changed')) {
            throw new Error('Student status compatibility guard is missing');
          }
          if (!hardening.includes('Administrator PIN sign-in has been disabled')) {
            throw new Error('Legacy administrator PIN sign-in is not explicitly disabled');
          }
          NODE
      - name: Verify owner dashboard modules use owner shell
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('admin.html', 'utf8');
          if (!html.includes('id="registrationStaffShell"') || !html.includes('id="dashboardShell"')) {
            throw new Error('The two admin dashboard shells must exist for role separation');
          }
          for (const path of ['assets/admin-suite.js', 'assets/admin-enterprise.js']) {
            const code = fs.readFileSync(path, 'utf8');
            if (!code.includes("document.querySelector('#dashboardShell .dashboard-sidebar nav')") ||
                !code.includes("document.querySelector('#dashboardShell .dashboard-main')")) {
              throw new Error(path + ': owner dashboard selectors are not correctly scoped');
            }
            if (/document\.querySelector\('\.dashboard-(?:sidebar|main)/.test(code)) {
              throw new Error(path + ': ambiguous selector may target the hidden staff dashboard');
            }
          }
          NODE
      - name: Verify owner PIN reset and restricted registration staff access
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const hardening = fs.readFileSync('functions/security-hardening-loader.js','utf8');
          const html = fs.readFileSync('admin.html','utf8');
          const staff = fs.readFileSync('assets/admin-registration.js','utf8');
          const ownerUi = fs.readFileSync('assets/admin.js','utf8');
          for (const required of [
            "const STAFF_PIN_VERSION = 'staff-pin-v1'",
            "const validStaffPin = value => /^[0-9]{4}$/.test",
            "if (!strongAdminPassword(entered))",
            "account.credentialType !== STAFF_PIN_VERSION",
            "app.adminSetStaffPin = onCall",
            "app.adminCreateAdmin = onCall",
            "app.adminChangePassword = onCall",
            "requireStrongAdminSession(request)",
            "!new Set(['adminGetRegistrationWorkspace', 'adminSetRegistrationStatus', 'adminEditRegistration', 'adminDeskCreateFacilitator', 'adminDeskGetInsights', 'adminDeskSaveTracking', 'adminDeskSetOnboarding', 'adminDeskAcknowledgeAlerts', 'adminDeskLogExport', 'adminDeskSendApprovedTemplate']).has(name)",
            "Staff PINs can only be changed by the main administrator."
          ]) {
            if (!hardening.includes(required)) throw new Error('Security guard missing: ' + required);
          }
          for (const required of [
            'id="newAdminPin"', 'id="staffPinModal"',
            'id="registrationStaffOverview"', 'id="registrationStaffKpis"',
            'id="registrationStaffReports"', 'id="registrationStaffRecent"',
            'id="registrationStaffDateFilter"', 'id="registrationStaffExportAll"'
          ]) {
            if (!html.includes(required)) throw new Error('Staff dashboard control missing: ' + required);
          }
          if (html.includes('id="registrationStaffPassword"') ||
              html.includes('id="registrationStaffPasswordForm"') ||
              html.includes('id="newAdminPassword"')) {
            throw new Error('A forbidden staff credential-change control remains visible');
          }
          if (staff.includes("adminChangePassword") ||
              staff.includes("registrationStaffPasswordForm") ||
              staff.includes("registrationStaffCurrentPassword")) {
            throw new Error('Restricted staff JS must not contain a PIN change flow');
          }
          for (const required of [
            'registrationStaffOverview', 'registrationStaffReports',
            'registrationStaffProgramBars', 'registrationStaffIntakeBars',
            'registrationStaffStatusBars', 'registrationStaffRecent',
            'registrationStaffExportAll', 'registrationStaffReportsExport'
          ]) {
            if (!staff.includes(required)) throw new Error('Staff dashboard wiring is missing: ' + required);
          }
          if (!ownerUi.includes('data-set-admin-pin') ||
              !ownerUi.includes("adminSetStaffPin")) {
            throw new Error('Owner staff-PIN reset control is missing');
          }
          NODE
      - name: Verify staff registration table has no action column
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('admin.html', 'utf8');
          const staffShell = html.split('id="registrationStaffShell"', 2)[1].split('id="dashboardShell"', 1)[0];
          const staff = fs.readFileSync('assets/admin-registration.js', 'utf8');
          if (staffShell.includes('<th>Registration actions</th>') ||
              staffShell.includes('colspan="6"') ||
              !staffShell.includes('<th>Status</th></tr>')) {
            throw new Error('Staff registration table must show status without an actions column');
          }
          if (staff.includes('data-registration-status') ||
              staff.includes('Cancel registration</button>') ||
              staff.includes('changeStatus(')) {
            throw new Error('Staff registration action buttons or handlers must not be rendered');
          }
          NODE
      - name: Verify restricted staff registration editor
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const hardening = fs.readFileSync('functions/security-hardening-loader.js','utf8');
          const frontend = fs.readFileSync('assets/admin-registration.js','utf8');
          const html = fs.readFileSync('admin.html','utf8');
          const staff = html.split('id="registrationStaffShell"',2)[1].split('id="dashboardShell"',1)[0];
          for (const text of [
            'app.adminEditRegistration = onCall',
            'REGISTRATION_EDIT_FIELDS.includes(key)',
            'registrationVersion(student)!==version',
            'Edited student registration',
            'The selected program is full for this intake.',
            'The owner must handle program changes after attendance has been recorded.',
            "'adminEditRegistration', 'adminDeskCreateFacilitator', 'adminDeskGetInsights', 'adminDeskSaveTracking', 'adminDeskSetOnboarding', 'adminDeskAcknowledgeAlerts', 'adminDeskLogExport', 'adminDeskSendApprovedTemplate']).has(name)"
          ]) {
            if (!hardening.includes(text)) throw new Error('Registration editing guard missing: '+text);
          }
          for (const id of ['registrationStaffEditModal','registrationStaffEditForm','registrationEditName','registrationEditMobile',
            'registrationEditWhatsapp','registrationEditEmail','registrationEditAddress','registrationEditCourse','registrationEditStatus']) {
            if (!html.includes('id="'+id+'"')) throw new Error('Registration editor input missing: '+id);
          }
          if (!frontend.includes("SkyDreamFirebase.call('adminEditRegistration'") ||
              !frontend.includes('data-edit-registration') ||
              !frontend.includes('registrationStaffExportAll') ||
              staff.includes('<th>Registration actions</th>')) {
            throw new Error('Staff editor / export UI is missing or the removed action column returned');
          }
          NODE
      - name: Verify registration-staff facilitator creation stays restricted
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const security = fs.readFileSync('functions/security-hardening-loader.js','utf8');
          const html = fs.readFileSync('admin.html','utf8');
          const frontend = fs.readFileSync('assets/admin-registration.js','utf8');
          const required = [
            'app.adminDeskCreateFacilitator = onCall',
            'requireStrongAdminSession(request)',
            "'SkyDream-Facilitator-' + pin + '-Aa9!'",
            "enforceRateLimit(request, 'registration-desk-create-facilitator'",
            "'adminDeskCreateFacilitator', 'adminDeskGetInsights', 'adminDeskSaveTracking', 'adminDeskSetOnboarding', 'adminDeskAcknowledgeAlerts', 'adminDeskLogExport', 'adminDeskSendApprovedTemplate']).has(name)",
            "Created facilitator from registration desk",
            "That facilitator username is already registered."
          ];
          for (const value of required) {
            if (!security.includes(value)) throw new Error('Facilitator security requirement missing: '+value);
          }
          const ids = ['registrationStaffFacilitators','registrationFacilitatorForm',
            'registrationFacilitatorName','registrationFacilitatorUsername','registrationFacilitatorPhone',
            'registrationFacilitatorPin','registrationFacilitatorCourses','registrationFacilitatorList'];
          for (const id of ids) {
            if (!html.includes('id="'+id+'"')) throw new Error('Facilitator UI is missing: '+id);
          }
          const staffShell = html.split('id="registrationStaffShell"',2)[1].split('id="dashboardShell"',1)[0];
          if (staffShell.includes('data-delete-facilitator') || staffShell.includes('data-reset-facilitator-pin')) {
            throw new Error('Staff cannot delete facilitators or reset facilitator PINs');
          }
          if (!frontend.includes("SkyDreamFirebase.call('adminDeskCreateFacilitator',payload)")) {
            throw new Error('Staff facilitator creation must call the restricted server endpoint');
          }
          NODE
      - name: Check eight Registration Desk workflows and approval controls
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const backend=fs.readFileSync('functions/registration-desk-operations.js','utf8');
          const security=fs.readFileSync('functions/security-hardening-loader.js','utf8');
          const staff=fs.readFileSync('assets/admin-desk-operations.js','utf8');
          const owner=fs.readFileSync('assets/admin-desk-owner.js','utf8');
          const html=fs.readFileSync('admin.html','utf8');
          const registration=fs.readFileSync('assets/admin-registration.js','utf8');
          const handlers=[
            'adminDeskGetInsights','adminDeskSaveTracking','adminDeskSetOnboarding',
            'adminDeskAcknowledgeAlerts','adminDeskLogExport',
            'adminOwnerGetDeskTemplates','adminOwnerSaveDeskTemplate','adminDeskSendApprovedTemplate'
          ];
          for(const action of handlers){
            if(!backend.includes('app.'+action+'='))throw new Error('Missing secure action '+action);
          }
          for(const snippet of [
            "require('./registration-desk-operations')(app",
            "'adminDeskSendApprovedTemplate']).has(name)",
            "Staff PINs can only be changed by the main administrator."
          ])if(!security.includes(snippet))throw new Error('Security boundary missing '+snippet);
          for(const id of ['deskWorkflow','deskCapacity','deskOnboarding','deskMessages',
            'deskDaily','deskPendingTable','deskDailyDownload','deskAlertBadge',
            'deskOwnActivity','deskMessagePreview','deskOnboardingCards']){
            if(!html.includes('id="'+id+'"'))throw new Error('Missing staff feature '+id);
          }
          if(!html.includes('assets/admin-desk-owner.js') ||
              !html.includes('assets/admin-desk-operations.js') ||
              !owner.includes("skydream-owner-session-ready") ||
              !staff.includes('adminDeskSendApprovedTemplate') ||
              !registration.includes("adminDeskLogExport")) {
            throw new Error('Registration operations are not fully wired');
          }
          if(!backend.includes("t.approved===true") &&
              !backend.includes("t.approved === true")) throw new Error('Staff template approvals are not enforced');
          if(!backend.includes("ownAudit") ||
              !backend.includes("a.admin")) throw new Error('Staff audit history must be scoped to their own account');
          NODE
      - name: Check HTML for duplicate IDs
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if d.get('id'):
                      self.ids.append(d['id'])

          failed = False
          for path in Path('.').glob('*.html'):
              parser = IdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
              if duplicates:
                  failed = True
                  print(f'{path}: duplicate IDs: {duplicates}')
          raise SystemExit(1 if failed else 0)
          PY

      - name: Verify strict CSP compatibility
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          failures = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if re.search(r'''style\s*=\s*["']''', text, re.I):
                  failures.append(f"{path}: inline style attribute")
              if re.search(r'<style(?:\s|>)', text, re.I):
                  failures.append(f"{path}: inline style block")
              if re.search(r'''\son[a-z]+\s*=\s*["']''', text, re.I):
                  failures.append(f"{path}: inline event handler")

          js_paths = list(Path('assets').glob('*.js')) + [Path('pwa.js'), Path('service-worker.js')]
          for path in js_paths:
              text = path.read_text(encoding='utf-8')
              if re.search(r'''style\s*=\s*["']''', text, re.I):
                  failures.append(f"{path}: generated inline style attribute")
              if re.search(r'''\son[a-z]+\s*=\s*["']''', text, re.I):
                  failures.append(f"{path}: generated inline event handler")
              if re.search(r'<style(?:\s|>)', text, re.I):
                  failures.append(f"{path}: generated inline style block")
              if re.search(r'<script(?:\s|>)', text, re.I):
                  failures.append(f"{path}: generated inline script block")
              if "createElement('style')" in text or 'createElement("style")' in text:
                  failures.append(f"{path}: runtime-created style block")
              if '.style.' in text or 'cssText' in text:
                  failures.append(f"{path}: direct inline style mutation")

          headers = Path('_headers').read_text(encoding='utf-8')
          if "'unsafe-inline'" in headers:
              failures.append("_headers: unsafe-inline is forbidden")

          admin_html = Path('admin.html').read_text(encoding='utf-8')
          admin_js = Path('assets/admin.js').read_text(encoding='utf-8')
          if 'upgradePanel' in admin_html or 'old PIN' in admin_html:
              failures.append('admin.html: obsolete legacy PIN upgrade UI is present')
          if 'upgradeAdminPassword' in admin_js or 'pendingLegacy' in admin_js:
              failures.append('assets/admin.js: obsolete legacy PIN migration code is present')

          portal = Path('functions/academic-portal-loader.js').read_text(encoding='utf-8')
          dashboard = portal.split('app.getStudentPortalDashboard=', 1)[-1]
          if '...doc.data()' in dashboard:
              failures.append('student portal dashboard returns unfiltered document data')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          PY

      - name: Validate Firebase configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8')); JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'));"
