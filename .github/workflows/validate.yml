name: Validate SkyDream site

on:
  push:
    branches: [main, security-seo-hardening, security-hardening-2026-10-06]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find functions assets -type f -name '*.js' -print0)
          node --check pwa.js
          node --check service-worker.js
      - name: Verify production security entrypoint
        run: |
          node - <<'NODE'
          const pkg = require('./functions/package.json');
          if (pkg.main !== 'security-hardening-loader.js') {
            throw new Error('Production functions must use security-hardening-loader.js');
          }
          const fs = require('fs');
          const hardening = fs.readFileSync('functions/security-hardening-loader.js', 'utf8');
          if (!hardening.includes('checkStudentStatus is intentionally not wrapped or changed')) {
            throw new Error('Student status compatibility guard is missing');
          }
          if (!hardening.includes('Administrator PIN sign-in has been disabled')) {
            throw new Error('Legacy administrator PIN sign-in is not explicitly disabled');
          }
          NODE
      - name: Verify owner dashboard modules use owner shell
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('admin.html', 'utf8');
          if (!html.includes('id="registrationStaffShell"') || !html.includes('id="dashboardShell"')) {
            throw new Error('The two admin dashboard shells must exist for role separation');
          }
          for (const path of ['assets/admin-suite.js', 'assets/admin-enterprise.js']) {
            const code = fs.readFileSync(path, 'utf8');
            if (!code.includes("document.querySelector('#dashboardShell .dashboard-sidebar nav')") ||
                !code.includes("document.querySelector('#dashboardShell .dashboard-main')")) {
              throw new Error(path + ': owner dashboard selectors are not correctly scoped');
            }
            if (/document\.querySelector\('\.dashboard-(?:sidebar|main)/.test(code)) {
              throw new Error(path + ': ambiguous selector may target the hidden staff dashboard');
            }
          }
          NODE
      - name: Check HTML for duplicate IDs
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if d.get('id'):
                      self.ids.append(d['id'])

          failed = False
          for path in Path('.').glob('*.html'):
              parser = IdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
              if duplicates:
                  failed = True
                  print(f'{path}: duplicate IDs: {duplicates}')
          raise SystemExit(1 if failed else 0)
          PY

      - name: Verify strict CSP compatibility
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          failures = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if re.search(r'''style\s*=\s*["']''', text, re.I):
                  failures.append(f"{path}: inline style attribute")
              if re.search(r'<style(?:\s|>)', text, re.I):
                  failures.append(f"{path}: inline style block")
              if re.search(r'''\son[a-z]+\s*=\s*["']''', text, re.I):
                  failures.append(f"{path}: inline event handler")

          js_paths = list(Path('assets').glob('*.js')) + [Path('pwa.js'), Path('service-worker.js')]
          for path in js_paths:
              text = path.read_text(encoding='utf-8')
              if re.search(r'''style\s*=\s*["']''', text, re.I):
                  failures.append(f"{path}: generated inline style attribute")
              if re.search(r'''\son[a-z]+\s*=\s*["']''', text, re.I):
                  failures.append(f"{path}: generated inline event handler")
              if re.search(r'<style(?:\s|>)', text, re.I):
                  failures.append(f"{path}: generated inline style block")
              if re.search(r'<script(?:\s|>)', text, re.I):
                  failures.append(f"{path}: generated inline script block")
              if "createElement('style')" in text or 'createElement("style")' in text:
                  failures.append(f"{path}: runtime-created style block")
              if '.style.' in text or 'cssText' in text:
                  failures.append(f"{path}: direct inline style mutation")

          headers = Path('_headers').read_text(encoding='utf-8')
          if "'unsafe-inline'" in headers:
              failures.append("_headers: unsafe-inline is forbidden")

          admin_html = Path('admin.html').read_text(encoding='utf-8')
          admin_js = Path('assets/admin.js').read_text(encoding='utf-8')
          if 'upgradePanel' in admin_html or 'old PIN' in admin_html:
              failures.append('admin.html: obsolete legacy PIN upgrade UI is present')
          if 'upgradeAdminPassword' in admin_js or 'pendingLegacy' in admin_js:
              failures.append('assets/admin.js: obsolete legacy PIN migration code is present')

          portal = Path('functions/academic-portal-loader.js').read_text(encoding='utf-8')
          dashboard = portal.split('app.getStudentPortalDashboard=', 1)[-1]
          if '...doc.data()' in dashboard:
              failures.append('student portal dashboard returns unfiltered document data')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          PY

      - name: Validate Firebase configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8')); JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'));"
